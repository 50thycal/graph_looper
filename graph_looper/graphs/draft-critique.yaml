name: draft-critique
description: >-
  The smallest useful loop: a resident writer and an ephemeral critic, trading
  drafts until a gate says it is good enough — and remembering across runs
  which mistakes keep coming back.

defaults:
  model: claude-opus-5
  effort: medium
  max_visits: 3
  # A resident writer otherwise carries every draft it has ever written into
  # the next call. Two exchanges is enough to revise from.
  keep_last: 2

nodes:
  - id: brief
    type: input
    title: Brief

  - id: writer
    type: agent
    title: Writer
    mode: resident
    join: any
    prompt: |
      Brief: {{ task }}

      Notes from earlier sessions — recurring problems worth avoiding up front:
      {{ state.lessons }}

      Critique of your last draft (blank on the first pass):
      {{ results.critic }}

      Write the next draft. Output the draft only.

  - id: critic
    type: agent
    title: Critic
    prompt: |
      Brief: {{ task }}

      Draft:
      {{ inputs.writer }}

      Name the three things most worth fixing, most important first. If the
      draft meets the brief, say "Ship it." and nothing else.

  - id: good_enough
    type: gate
    title: Good enough
    choices: [ship, revise]
    max_visits: 3
    on_exhausted: ship
    prompt: |
      Brief: {{ task }}

      Critique of the current draft:
      {{ inputs.critic }}

      Choose "ship" if the critique is only preference or polish. Choose
      "revise" if it names something that fails the brief.

  - id: lesson
    type: agent
    title: Record the lesson
    effort: low
    # This is what makes the graph compound: one line per run, read back by the
    # writer next time. Bounded, so it stays a note and not a transcript.
    writes_state: lessons
    state_append: true
    state_limit: 10
    prompt: |
      A draft went through {{ results.good_enough }} rounds of review. The final
      critique was:

      {{ inputs.good_enough }}

      In one sentence, state the single mistake most worth avoiding next time
      someone writes to a brief like this one. If nothing generalises beyond
      this specific draft, reply exactly "none".

  - id: final
    type: output
    title: Final draft
    prompt: "{{ results.writer }}"

edges:
  - from: brief
    to: writer
  - from: writer
    to: critic
  - from: critic
    to: good_enough
  - from: good_enough
    to: writer
    when: revise
    label: revise
  - from: good_enough
    to: lesson
    when: ship
  - from: lesson
    to: final
